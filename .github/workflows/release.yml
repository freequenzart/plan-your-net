name: Draft Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: node scripts/release.mjs --check-version "$env:RELEASE_TAG"
      - run: npm run release:check
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - run: npm run test:electron
      - run: npm run package:electron
      - run: npm run build
      - run: npm run release:artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-artifacts
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
  draft:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-artifacts
          path: artifacts
      - name: Create draft release for manual review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=(--draft --verify-tag --repo "$GITHUB_REPOSITORY" --title "Plan Your Net $RELEASE_TAG" --notes-file CHANGELOG.md)
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" artifacts/* "${flags[@]}"
